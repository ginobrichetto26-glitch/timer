<!DOCTYPE html>
<html>
<head>
    <title>Aesthetic Calendar</title>

    <style>

        body {
            width: 250px;
            height: 350px;
            margin: 15px auto;
            font-family: Arial, sans-serif;
            background-color: #fffaf6;
            color: #654c3c;
        }

        h3 {
            text-align: center;
            color: #c4774d;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        #calWrapper {
            width: 100%;
            border-collapse: separate;
            border-spacing: 2px;
        }

        .dayHeader {
            width: 30px;
            height: 18px;
            background-color: #fde6d5;
            color: #b56d47;
            font-size: 8px;
            font-weight: bold;
            text-align: center;
            border-radius: 5px;
        }

        .dayCell {
            width: 30px;
            height: 30px;
            font-size: 9px;
            vertical-align: top;
            text-align: right;
            padding: 4px;
            box-sizing: border-box;
            background-color: #fff0e5;
            color: #725442;
            border-radius: 6px;
        }

        .emptyCell {
            background-color: transparent;
        }

        .today {
            background-color: #f6c29d;
            color: #8c4d2e;
            font-weight: bold;
            border: 1px solid #e6a273;
        }

    </style>
</head>

<body>

    <h3>
        <span id="dateHolder"></span>
    </h3>

    <table id="calWrapper">
    </table>


    <script>

        (function() {

            var today = new Date();

            var month = today.getMonth();
            var day = today.getDate();
            var year = today.getFullYear();


            var months = [
                "January",
                "February",
                "March",
                "April",
                "May",
                "June",
                "July",
                "August",
                "September",
                "October",
                "November",
                "December"
            ];


            var days = [
                "Sun",
                "Mon",
                "Tue",
                "Wed",
                "Thu",
                "Fri",
                "Sat"
            ];


            function displayDate() {

                var holder =
                    document.getElementById("dateHolder");

                holder.innerText =
                    months[month] + " " + year;

            }


            function createDayHeaders() {

                var wrapper =
                    document.getElementById("calWrapper");

                var row =
                    document.createElement("tr");


                for (var i = 0; i < days.length; i++) {

                    var el =
                        document.createElement("th");

                    el.setAttribute(
                        "class",
                        "dayHeader"
                    );

                    el.innerText = days[i];

                    row.appendChild(el);
                }


                wrapper.appendChild(row);
            }


            function createDayCells() {

                var wrapper =
                    document.getElementById("calWrapper");

                var firstDay =
                    new Date(year, month, 1).getDay();

                var lastDay =
                    new Date(
                        year,
                        month + 1,
                        0
                    ).getDate();

                var dayNumber = 1;


                while (dayNumber <= lastDay) {

                    var row =
                        document.createElement("tr");


                    for (var i = 0; i < 7; i++) {

                        var cell =
                            document.createElement("td");


                        if (
                            dayNumber === 1 &&
                            i < firstDay
                        ) {

                            cell.setAttribute(
                                "class",
                                "dayCell emptyCell"
                            );

                        }

                        else if (dayNumber <= lastDay) {

                            cell.setAttribute(
                                "class",
                                "dayCell"
                            );

                            cell.innerText =
                                dayNumber;


                            if (
                                dayNumber === day &&
                                month === today.getMonth() &&
                                year === today.getFullYear()
                            ) {

                                cell.setAttribute(
                                    "class",
                                    "dayCell today"
                                );

                            }


                            dayNumber++;

                        }

                        else {

                            cell.setAttribute(
                                "class",
                                "dayCell emptyCell"
                            );

                        }


                        row.appendChild(cell);
                    }


                    wrapper.appendChild(row);
                }
            }


            displayDate();

            createDayHeaders();

            createDayCells();

        })();

    </script>

</body>
</html>
