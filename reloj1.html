<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, sans-serif;
}

/* WIDGET */
.progress-card {
    width: 300px;
    height: 125px;
    background: #FFF4EC;
    border-radius: 12px;
    padding: 18px 20px;
    color: #D9824B;
}

/* TÍTULO */
.title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 14px;
}

/* INFORMACIÓN */
.info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #777;
    font-size: 12px;
    margin-bottom: 9px;
}

.week {
    font-weight: bold;
    color: #D9824B;
}

/* BARRA */
.progress-bar {
    width: 100%;
    height: 9px;
    background: #F8DED0;
    border-radius: 10px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #F4A875;
    border-radius: 10px;
    transition: width 0.5s ease;
}

</style>
</head>

<body>

<div class="progress-card">

    <div class="title">
        semester progress
    </div>

    <div class="info">
        <span>Fall 2026</span>
        <span class="week" id="week">Week 1 of 16</span>
    </div>

    <div class="progress-bar">
        <div class="progress" id="progress"></div>
    </div>

</div>

<script>

const semesterStart = new Date("2026-08-24");
const totalWeeks = 16;
const totalDays = totalWeeks * 7;

function updateProgress() {

    const today = new Date();

    const difference =
        today.getTime() - semesterStart.getTime();

    const daysPassed =
        difference / (1000 * 60 * 60 * 24);

    /* Semana actual */
    let currentWeek =
        Math.floor(daysPassed / 7) + 1;

    if (currentWeek < 1) {
        currentWeek = 1;
    }

    if (currentWeek > totalWeeks) {
        currentWeek = totalWeeks;
    }

    /* PROGRESO REAL POR DÍAS */
    let percentage =
        (daysPassed / totalDays) * 100;

    if (percentage < 0) {
        percentage = 0;
    }

    if (percentage > 100) {
        percentage = 100;
    }

    document.getElementById("week").textContent =
        "Week " + currentWeek + " of " + totalWeeks;

    document.getElementById("progress").style.width =
        percentage + "%";
}

updateProgress();

</script>

</body>
</html>
