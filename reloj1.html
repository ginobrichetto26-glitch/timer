   <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reloj Digital Pastel</title>

<style>
  :root {
    --bg1: #ffe5ec;
    --bg2: #e0f7fa;
    --card: #ffffff;
    --text: #4a4a68;
    --muted: #9b9bb4;
    --pink-dark: #ff9eb5;
    --lavender-dark: #b9a3e6;
    --mint: #c1f0dc;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    overflow: hidden;
    padding: 4vw;
  }

  .card {
    position: relative;
    background: var(--card);
    border-radius: 2vw;
    box-shadow: 0 1.5vw 3vw rgba(150, 130, 180, 0.2);
    width: 100%;
    max-width: 480px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .digital-time {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.08em;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    font-size: clamp(4rem, 18vw, 8rem);
    line-height: 1;
  }

  .digital-time .colon {
    color: var(--pink-dark);
    animation: blink 1s steps(1) infinite;
  }

  .digital-time .seconds {
    font-size: 0.35em;
    color: var(--lavender-dark);
    align-self: flex-end;
    margin-left: 0.05em;
  }

  @keyframes blink {
    50% {
      opacity: 0.2;
    }
  }

  /* AM / PM abajo a la izquierda */
  .ampm {
    position: absolute;
    bottom: 20px;
    left: 25px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* Fecha abajo a la derecha */
  .date-label {
    position: absolute;
    bottom: 20px;
    right: 25px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: capitalize;
  }
</style>
</head>

<body>

<div class="card">

  <div class="digital-time">
    <span id="hours">00</span>
    <span class="colon">:</span>
    <span id="minutes">00</span>
    <span class="seconds" id="seconds">00</span>
  </div>

  <div class="ampm" id="ampm">AM</div>

  <div class="date-label" id="dateLabel"></div>

</div>

<script>

  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const ampmEl = document.getElementById('ampm');
  const dateLabel = document.getElementById('dateLabel');

  function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();

    const ampm = hours >= 12 ? 'PM' : 'AM';

    hours = hours % 12;
    hours = hours === 0 ? 12 : hours;

    hoursEl.textContent = hours.toString().padStart(2, '0');
    minutesEl.textContent = minutes.toString().padStart(2, '0');
    secondsEl.textContent = now.getSeconds().toString().padStart(2, '0');

    ampmEl.textContent = ampm;

    const opciones = {
      day: 'numeric',
      month: 'short'
    };

    dateLabel.textContent = now.toLocaleDateString('en-US', opciones);
  }

  updateClock();
  setInterval(updateClock, 1000);

</script>

</body>
</html>
