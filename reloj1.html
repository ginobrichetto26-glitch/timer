<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, sans-serif;
}

/* RELOJ */
.clock {
    display: flex;
    width: 700px;
    height: 300px;
}

/* CADA CUADRO */
.box {
    position: relative;
    width: 50%;
    height: 100%;
    background: #FFD3B5;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* LÍNEA DEL MEDIO */
.line {
    width: 4px;
    height: 100%;
    background: white;
}

/* NÚMEROS */
.number {
    color: white;
    font-size: 150px;
    font-weight: bold;
    line-height: 1;
}

/* PM */
.ampm {
    position: absolute;
    bottom: 18px;
    left: 22px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

/* DÍA */
.day {
    position: absolute;
    bottom: 18px;
    right: 22px;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="clock">

    <div class="box">
        <div class="number" id="hours">07</div>
        <div class="ampm" id="ampm">PM</div>
    </div>

    <div class="line"></div>

    <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="day" id="day">WEDNESDAY</div>
    </div>

</div>

<script>

function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    let minutes = now.getMinutes();

    let ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;

    if (hours === 0) {
        hours = 12;
    }

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("ampm").textContent = ampm;

    document.getElementById("day").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "long"
        }).toUpperCase();
}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
