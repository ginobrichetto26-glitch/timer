<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunrise Digital Clock</title>

<style>
  :root {
    --bg1: #ffd6a5;
    --bg2: #ffb7a5;
    --bg3: #ffe8c2;
    --card: #fffaf5;
    --text: #5a4650;
    --muted: #a87868;
    --sunset: #f28c6b;
    --lavender: #c69acb;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
      135deg,
      var(--bg1),
      var(--bg2),
      var(--bg3)
    );
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    overflow: hidden;
    padding: 4vw;
  }

  .card {
    position: relative;
    background: var(--card);
    border-radius: 2vw;
    box-shadow: 0 1.5vw 3vw rgba(180, 120, 90, 0.2);
    width: 100%;
    max-width: 480px;
    height: 260px;

    display: flex;
    align-items: center;
    justify-content: center;
  }

  .digital-time {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.08em;

    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;

    font-size: clamp(4rem, 18vw, 8rem);
    line-height: 1;
  }

  .digital-time .colon {
    color: var(--sunset);
    animation: blink 1s steps(1) infinite;
  }

  .digital-time .seconds {
    font-size: 0.35em;
    color: var(--lavender);
    align-self: flex-end;
    margin-left: 0.05em;
  }

  @keyframes blink {
    50% {
      opacity: 0.2;
    }
  }

  /* AM / PM abajo a la izquierda */
  .ampm {
    position: absolute;
    bottom: 20px;
    left: 25px;

    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
  }

  /* Día de la semana abajo a la derecha */
  .day-label {
    position: absolute;
    bottom: 20px;
    right: 25px;

    font-size: 1rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: capitalize;
  }
</style>
</head>

<body>

<div class="card">

  <div class="digital-time">
    <span id="hours">00</span>
    <span class="colon">:</span>
    <span id="minutes">00</span>
    <span class="seconds" id="seconds">00</span>
  </div>

  <div class="ampm" id="ampm">AM</div>

  <div class="day-label" id="dayLabel">Wednesday</div>

</div>

<script>

  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const secondsEl = document.getElementById('seconds');
  const ampmEl = document.getElementById('ampm');
  const dayLabel = document.getElementById('dayLabel');

  function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();

    // AM / PM
    const ampm = hours >= 12 ? 'PM' : 'AM';

    // Convertir a formato de 12 horas
    hours = hours % 12;
    hours = hours === 0 ? 12 : hours;

    hoursEl.textContent = hours.toString().padStart(2, '0');
    minutesEl.textContent = minutes.toString().padStart(2, '0');
    secondsEl.textContent = now.getSeconds().toString().padStart(2, '0');

    ampmEl.textContent = ampm;

    // Día de la semana
    dayLabel.textContent = now.toLocaleDateString('en-US', {
      weekday: 'long'
    });
  }

  updateClock();

  setInterval(updateClock, 1000);

</script>

</body>
</html>
