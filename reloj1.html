<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    font-family: 'Arial Narrow', 'Arial', sans-serif;
    overflow: hidden;
  }

  /* CONTENEDOR GENERAL */
  .clock {
    display: flex;
    width: 100%;
    max-width: 700px;
    height: 300px;
    gap: 3px;
  }

  /* CADA MITAD */
  .panel {
    position: relative;
    flex: 1;
    background: #FFD1AE;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  /* NÚMEROS */
  .number {
    color: #ffffff;
    font-size: clamp(6rem, 15vw, 11rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.06em;
    font-family: 'Arial Narrow', 'Arial', sans-serif;
  }

  /* PM */
  .ampm {
    position: absolute;
    bottom: 18px;
    left: 25px;

    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }

  /* DÍA */
  .day {
    position: absolute;
    bottom: 18px;
    right: 25px;

    color: #ffffff;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  /* LÍNEA DEL MEDIO */
  .divider {
    width: 3px;
    background: #ffffff;
  }

</style>
</head>

<body>

<div class="clock">

  <!-- HORAS -->
  <div class="panel">
    <div class="number" id="hours">07</div>
    <div class="ampm" id="ampm">PM</div>
  </div>

  <!-- LÍNEA -->
  <div class="divider"></div>

  <!-- MINUTOS -->
  <div class="panel">
    <div class="number" id="minutes">00</div>
    <div class="day" id="day">FRIDAY</div>
  </div>

</div>

<script>

  const hoursEl = document.getElementById('hours');
  const minutesEl = document.getElementById('minutes');
  const ampmEl = document.getElementById('ampm');
  const dayEl = document.getElementById('day');

  function updateClock() {

    const now = new Date();

    let hours = now.getHours();
    const minutes = now.getMinutes();

    // AM / PM
    const ampm = hours >= 12 ? 'PM' : 'AM';

    // Convertir a formato 12 horas
    hours = hours % 12;
    hours = hours === 0 ? 12 : hours;

    // Mostrar hora y minutos
    hoursEl.textContent = hours.toString().padStart(2, '0');
    minutesEl.textContent = minutes.toString().padStart(2, '0');

    // AM / PM
    ampmEl.textContent = ampm;

    // Día de la semana
    dayEl.textContent = now.toLocaleDateString('en-US', {
      weekday: 'long'
    }).toUpperCase();
  }

  updateClock();

  // Actualizar cada segundo
  setInterval(updateClock, 1000);

</script>

</body>
</html>
